<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Контакты · USDT→RUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1c1c1e;
            --gray: #2c2c2e;
            --gray2: #3a3a3c;
            --text: #ffffff;
            --sub: #8e8e93;
            --blue: #007aff;
            --green: #34c759;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .app {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 24px 20px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .back-btn {
            background: var(--gray);
            border: 1px solid var(--gray2);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            text-decoration: none;
        }
        .back-btn:hover {
            background: var(--gray2);
        }
        .back-btn svg {
            width: 18px;
            height: 18px;
        }
        .header h2 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .contact-item {
            background: var(--gray);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: border 0.2s;
        }
        .contact-item:hover {
            border-color: var(--gray2);
        }
        .contact-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            opacity: 0.8;
        }
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .contact-label {
            font-size: 12px;
            color: var(--sub);
        }
        .contact-value {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
        }

        /* Футер */
        .footer {
            background: var(--card);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            font-size: 12px;
            color: var(--sub);
            line-height: 1.6;
        }
        .footer-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }
        .footer-brand img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            object-fit: contain;
        }
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .footer-links a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .footer-links a:hover {
            opacity: 0.8;
        }
        .footer-separator {
            color: var(--gray2);
            font-weight: 400;
        }
        .footer-divider {
            height: 1px;
            background: var(--gray2);
            margin: 12px 0;
        }
        .footer-contact {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
        }
        .footer-contact-title {
            font-weight: 600;
            color: var(--sub);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .footer-contact-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .footer-contact-row svg {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
            opacity: 0.7;
        }
        .footer-contact-separator {
            color: var(--gray2);
            margin: 0 2px;
        }
        .footer-copy {
            margin-top: 10px;
            font-size: 11px;
            color: #636366;
            text-align: center;
        }
    </style>
</head>
<body>

            <div class="footer-contact">

                    <span class="footer-contact-separator">•</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>

            <div class="footer-copy">

</html>
